# Runs the app's tests on every pull request to main. Gitar reads these
# results to diagnose failures and checks its own fix commits against them.
# Deploys still happen only on push to main (deploy.yaml).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund; fi
      - run: npm test
